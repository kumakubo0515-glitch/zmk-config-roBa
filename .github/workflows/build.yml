name: Build ZMK Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-left:
    name: Build Left Side (roba_left)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZMK Config
        uses: actions/checkout@v3

      - name: Build Left Firmware
        uses: zmkfirmware/zmk-docker-build@v1
        with:
          board: nice_nano_v2
          shield: roba_left

  build-right:
    name: Build Right Side (roba_right)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZMK Config
        uses: actions/checkout@v3

      - name: Build Right Firmware
        uses: zmkfirmware/zmk-docker-build@v1
        with:
          board: nice_nano_v2
          shield: roba_right
